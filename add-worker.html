
<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>कामगार जोडा</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <div class="logo">🌾 शेतकरी कामगार सेवा</div>
  <nav>
    <a href="index.html">मुख्यपृष्ठ</a>
    <a href="find-worker.html">कामगार शोधा</a>
    <a href="add-worker.html">कामगार जोडा</a>
    <a href="requirement.html">कामगाराची मागणी</a>
  </nav>
</header>

<main class="form-page">
  <div class="form-container">
    <div class="form-header">
      <span>WORKER REGISTRATION</span>
      <h1>नवीन कामगार जोडा</h1>
      <p>कामगाराची योग्य माहिती भरून नोंदणी करा.</p>
    </div>

    <form id="workerForm">
      <div class="form-grid">

        <div class="field">
          <label for="workerName">कामगाराचे पूर्ण नाव *</label>
          <input type="text" id="workerName" required>
        </div>

        <div class="field">
          <label for="workerMobile">मोबाईल नंबर *</label>
          <input type="tel" id="workerMobile"
                 maxlength="10" inputmode="numeric" required>
        </div>

        <div class="field">
          <label for="workerVillage">गाव *</label>
          <input type="text" id="workerVillage" required>
        </div>

        <div class="field">
          <label for="workerDistrict">जिल्हा</label>
          <input type="text" id="workerDistrict">
        </div>

        <div class="field">
          <label for="workerSkill">कामाचा प्रकार *</label>
          <select id="workerSkill" required>
            <option value="">निवडा</option>
            <option>शेती काम</option>
            <option>भाजीपाला काम</option>
            <option>फळबाग काम</option>
            <option>कापणी</option>
            <option>लागवड</option>
            <option>तण काढणे</option>
            <option>ट्रॅक्टर काम</option>
            <option>इतर</option>
          </select>
        </div>

        <div class="field">
          <label for="dailyRate">दिवसाचा दर ₹ *</label>
          <input type="number" id="dailyRate" min="1" required>
        </div>

        <div class="field">
          <label for="standardHours">दररोजचे मानक तास</label>
          <input type="number" id="standardHours"
                 value="8" min="1" max="24">
        </div>

        <div class="field">
          <label for="experience">अनुभव</label>
          <select id="experience">
            <option>नवीन</option>
            <option>1 वर्ष</option>
            <option>2-3 वर्षे</option>
            <option>4-5 वर्षे</option>
            <option>5+ वर्षे</option>
          </select>
        </div>

      </div>

      <div class="checkbox">
        <input type="checkbox" id="available" checked>
        <label for="available">सध्या कामासाठी उपलब्ध आहे</label>
      </div>

      <button type="submit" class="btn primary full">
        कामगार नोंदणी करा
      </button>
    </form>

    <div id="workerMessage" aria-live="polite"></div>
  </div>
</main>

<!-- Firebase SDK: हे app.js च्या आधी असणे आवश्यक आहे -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- app.js फक्त एकदाच लोड करा -->
<script src="js/app.js"></script>

</body>
</html>
