<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>कामगार जोडा</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <div class="logo">🌾 शेतकरी कामगार सेवा</div>
  <nav>
    <a href="index.html">मुख्यपृष्ठ</a>
    <a href="find-worker.html">कामगार शोधा</a>
    <a href="add-worker.html">कामगार जोडा</a>
    <a href="requirement.html">कामगाराची मागणी</a>
  </nav>
</header>

<main class="form-page">

<div class="form-container">

<div class="form-header">
  <span>WORKER REGISTRATION</span>
  <h1>नवीन कामगार जोडा</h1>
  <p>कामगाराची योग्य माहिती भरून नोंदणी करा.</p>
</div>

<form id="workerForm">

<div class="form-grid">

<div class="field">
<label>कामगाराचे पूर्ण नाव *</label>
<input type="text" id="workerName" required>
</div>

<div class="field">
<label>मोबाईल नंबर *</label>
<input type="tel" id="workerMobile" maxlength="10" required>
</div>

<div class="field">
<label>गाव *</label>
<input type="text" id="workerVillage" required>
</div>

<div class="field">
<label>जिल्हा</label>
<input type="text" id="workerDistrict">
</div>

<div class="field">
<label>कामाचा प्रकार *</label>
<select id="workerSkill" required>
<option value="">निवडा</option>
<option>शेती काम</option>
<option>भाजीपाला काम</option>
<option>फळबाग काम</option>
<option>कापणी</option>
<option>लागवड</option>
<option>तण काढणे</option>
<option>ट्रॅक्टर काम</option>
<option>इतर</option>
</select>
</div>

<div class="field">
<label>दिवसाचा दर ₹ *</label>
<input type="number" id="dailyRate" min="1" required>
</div>

<div class="field">
<label>दररोजचे मानक तास</label>
<input type="number" id="standardHours" value="8" min="1" max="24">
</div>

<div class="field">
<label>अनुभव</label>
<select id="experience">
<option>नवीन</option>
<option>1 वर्ष</option>
<option>2-3 वर्षे</option>
<option>4-5 वर्षे</option>
<option>5+ वर्षे</option>
</select>
</div>

</div>

<div class="checkbox">
<input type="checkbox" id="available" checked>
<label for="available">सध्या कामासाठी उपलब्ध आहे</label>
</div>

<button type="submit" class="btn primary full">
  कामगार नोंदणी करा
</button>

</form>

<div id="workerMessage"></div>

</div>

</main>

<script src="js/app.js"></script>

<script>
document.getElementById("workerForm").addEventListener("submit", function(e){

e.preventDefault();

const worker = {
id: Date.now(),
name: document.getElementById("workerName").value.trim(),
mobile: document.getElementById("workerMobile").value.trim(),
village: document.getElementById("workerVillage").value.trim(),
district: document.getElementById("workerDistrict").value.trim(),
skill: document.getElementById("workerSkill").value,
dailyRate: Number(document.getElementById("dailyRate").value),
standardHours: Number(document.getElementById("standardHours").value) || 8,
experience: document.getElementById("experience").value,
available: document.getElementById("available").checked,
createdAt: new Date().toLocaleString("en-IN")
};

if(worker.mobile.length !== 10){
showMessage("workerMessage","कृपया योग्य 10 अंकी मोबाईल नंबर टाका.","error");
return;
}

const workers = getWorkers();
workers.push(worker);
localStorage.setItem("farmWorkers", JSON.stringify(workers));

addNotification(
"नवीन कामगार नोंदणी",
worker.name + " यांनी कामगार म्हणून नोंदणी केली आहे.",
worker
);

showMessage(
"workerMessage",
"✅ कामगार यशस्वीरित्या नोंदणीकृत झाला!",
"success"
);

this.reset();

});
</script>

</body>
  
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- Website JavaScript -->
<script src="js/app.js"></script>

</body>
</html>

</html>
