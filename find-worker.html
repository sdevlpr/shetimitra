
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/app.js"></script>

<script>
let allWorkers = [];

async function loadWorkers() {
  const results = document.getElementById("workerResults");

  results.textContent = "कामगारांची माहिती लोड होत आहे...";

  try {
    allWorkers = await getWorkers();
    searchWorkers();
  } catch (error) {
    console.error("कामगार लोड करण्याची त्रुटी:", error);
    results.textContent =
      "कामगारांची माहिती मिळाली नाही. कृपया पेज Refresh करा.";
  }
}

function searchWorkers() {
  const text = document
    .getElementById("searchWorker")
    .value.toLowerCase()
    .trim();

  const skill = document.getElementById("skillFilter").value;

  const result = allWorkers.filter(w => {
    const name = (w.name || "").toLowerCase();
    const village = (w.village || "").toLowerCase();
    const workerSkill = (w.skill || "").toLowerCase();
    const district = (w.district || "").toLowerCase();

    const matchesText =
      !text ||
      name.includes(text) ||
      village.includes(text) ||
      workerSkill.includes(text) ||
      district.includes(text);

    const matchesSkill = !skill || w.skill === skill;

    return matchesText && matchesSkill;
  });

  renderWorkerData("workerResults", result);
}

document
  .getElementById("searchWorker")
  .addEventListener("input", searchWorkers);

document
  .getElementById("skillFilter")
  .addEventListener("change", searchWorkers);

loadWorkers();
</script>

</body>
</html>
