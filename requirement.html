<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>कामगाराची मागणी</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">
<div class="logo">🌾 शेतकरी कामगार सेवा</div>

<nav>
<a href="index.html">मुख्यपृष्ठ</a>
<a href="find-worker.html">कामगार शोधा</a>
<a href="add-worker.html">कामगार जोडा</a>
<a href="requirement.html">कामगाराची मागणी</a>
</nav>
</header>

<main class="form-page">

<div class="form-container">

<div class="form-header">
<span>WORKER REQUIREMENT</span>
<h1>कामगाराची मागणी नोंदवा</h1>
<p>तुमच्या शेतीच्या कामासाठी आवश्यक माहिती भरा.</p>
</div>

<form id="requirementForm">

<div class="form-grid">

<div class="field">
<label>आपले नाव *</label>
<input type="text" id="employerName" required>
</div>

<div class="field">
<label>मोबाईल नंबर *</label>
<input type="tel" id="employerMobile" maxlength="10" required>
</div>

<div class="field">
<label>गाव / ठिकाण *</label>
<input type="text" id="location" required>
</div>

<div class="field">
<label>कामाचा प्रकार *</label>
<select id="workType" required>
<option value="">निवडा</option>
<option>शेती काम</option>
<option>लागवड</option>
<option>कापणी</option>
<option>भाजीपाला काम</option>
<option>फळबाग काम</option>
<option>तण काढणे</option>
<option>इतर</option>
</select>
</div>

<div class="field">
<label>कामगारांची संख्या *</label>
<input type="number" id="workersNeeded" min="1" required>
</div>

<div class="field">
<label>कामाची तारीख *</label>
<input type="date" id="workDate" required>
</div>

<div class="field">
<label>काम सुरू होण्याची वेळ *</label>
<input type="time" id="startTime" required>
</div>

<div class="field">
<label>अंदाजे कामाचे तास *</label>
<input type="number" id="workHours" min="1" max="24" value="8" required>
</div>

</div>

<div class="field">
<label>अतिरिक्त माहिती</label>
<textarea id="requirementNote"
placeholder="कामाबद्दल अतिरिक्त माहिती..."></textarea>
</div>

<button class="btn primary full" type="submit">
मागणी पुढे पाठवा →
</button>

</form>

<div id="requirementMessage"></div>

</div>

</main>

<script src="js/app.js"></script>

<script>

document.getElementById("requirementForm")
.addEventListener("submit",function(e){

e.preventDefault();

const requirement = {

id:Date.now(),

employerName:
document.getElementById("employerName").value.trim(),

mobile:
document.getElementById("employerMobile").value.trim(),

location:
document.getElementById("location").value.trim(),

workType:
document.getElementById("workType").value,

workersNeeded:
Number(document.getElementById("workersNeeded").value),

workDate:
document.getElementById("workDate").value,

startTime:
document.getElementById("startTime").value,

workHours:
Number(document.getElementById("workHours").value),

note:
document.getElementById("requirementNote").value.trim(),

status:"Payment Pending",

createdAt:new Date().toLocaleString("en-IN")

};

if(requirement.mobile.length !== 10){

showMessage(
"requirementMessage",
"कृपया योग्य 10 अंकी मोबाईल नंबर टाका.",
"error"
);

return;

}

const requirements=getRequirements();

requirements.push(requirement);

localStorage.setItem(
"farmRequirements",
JSON.stringify(requirements)
);

addNotification(
"नवीन कामगार मागणी",
requirement.employerName +
" यांनी " +
requirement.workersNeeded +
" कामगारांची मागणी केली आहे.",
requirement
);

localStorage.setItem(
"selectedRequirement",
JSON.stringify(requirement)
);

showMessage(
"requirementMessage",
"✅ मागणी नोंदवली आहे. आता उपलब्ध कामगार निवडा.",
"success"
);

setTimeout(function(){
window.location.href="payment.html";
},1000);

});

</script>

</body>
</html>
