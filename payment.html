<script src="js/app.js"></script>

<script>
const requirement = JSON.parse(
    localStorage.getItem("selectedRequirement") || "null"
);

const totalAmountEl = document.getElementById("totalAmount");
const workerNumberEl = document.getElementById("workerNumber");
const hoursEl = document.getElementById("hours");
const upiButton = document.getElementById("upiButton");
const confirmButton = document.getElementById("confirmPayment");
const paymentMessage = document.getElementById("paymentMessage");

if (!requirement) {

    document.getElementById("requirementDetails").innerHTML =
        '<div class="alert error">कोणतीही active requirement सापडली नाही.</div>';

    totalAmountEl.textContent = "₹0";
    confirmButton.disabled = true;

} else {

    /* =========================
       REQUIREMENT DETAILS
       ========================= */

    document.getElementById("requirementDetails").innerHTML = `
        <div class="requirement-summary">
            <h3>📋 Requirement Details</h3>

            <p>
                <b>नाव:</b>
                ${escapeHTML(requirement.employerName || "")}
            </p>

            <p>
                <b>ठिकाण:</b>
                ${escapeHTML(requirement.location || "")}
            </p>

            <p>
                <b>काम:</b>
                ${escapeHTML(requirement.workType || "")}
            </p>

            <p>
                <b>तारीख:</b>
                ${escapeHTML(requirement.workDate || "")}
            </p>
        </div>
    `;


    /* =========================
       GET WORKERS + HOURS
       ========================= */

    const workers = Number(requirement.workersNeeded);
    const hours = Number(requirement.workHours);


    /* =========================
       PAYMENT CALCULATION
       ₹100 PER HOUR / WORKER
       ========================= */

    if (
        !Number.isFinite(workers) ||
        !Number.isFinite(hours) ||
        workers <= 0 ||
        hours <= 0
    ) {

        workerNumberEl.textContent = workers || 0;
        hoursEl.textContent = (hours || 0) + " तास";

        totalAmountEl.textContent = "₹0";

        confirmButton.disabled = true;

        paymentMessage.innerHTML = `
            <div class="alert error">
                ⚠️ कामगारांची संख्या किंवा कामाचे तास योग्य मिळाले नाहीत.
            </div>
        `;

    } else {

        /* ₹100 × workers × hours */
        const total = 100 * workers * hours;


        /* =========================
           SHOW PAYMENT SUMMARY
           ========================= */

        workerNumberEl.textContent = workers;

        hoursEl.textContent = hours + " तास";

        totalAmountEl.textContent =
            "₹" + total.toLocaleString("en-IN");


        /* =========================
           UPI PAYMENT LINK
           ========================= */

        const upiUrl =
            "upi://pay" +
            "?pa=pratikshadabhade2011@gmail.com" +
            "&pn=Farm%20Worker%20Service" +
            "&am=" + total +
            "&cu=INR";

        upiButton.href = upiUrl;


        /* =========================
           CONFIRM PAYMENT
           ========================= */

        confirmButton.addEventListener("click", function () {

            const utrInput =
                document.getElementById("utrNumber");

            const screenshotInput =
                document.getElementById("paymentScreenshot");


            /* UTR CHECK */

            if (!utrInput || !utrInput.value.trim()) {

                alert("कृपया Payment UTR / Transaction ID टाका.");

                if (utrInput) {
                    utrInput.focus();
                }

                return;
            }


            const utr = utrInput.value.trim();


            /* =========================
               ADMIN WHATSAPP NUMBER
               ========================= */

            const adminWhatsApp = "91XXXXXXXXXX";


            if (
                adminWhatsApp === "91XXXXXXXXXX" ||
                !/^\d{12}$/.test(adminWhatsApp)
            ) {

                alert(
                    "payment.html मध्ये Admin WhatsApp नंबर टाका.\n\n" +
                    "उदा. 919876543210"
                );

                return;
            }


            /* =========================
               BOOKING DATA
               ========================= */

            const booking = {

                id: Date.now(),

                requirementId: requirement.id,

                employerName:
                    requirement.employerName || "",

                mobile:
                    requirement.mobile || "",

                workersNeeded: workers,

                hours: hours,

                amount: total,

                utr: utr,

                status: "Pending Verification",

                createdAt:
                    new Date().toLocaleString("en-IN")
            };


            /* =========================
               SAVE BOOKING
               ========================= */

            const bookings = JSON.parse(
                localStorage.getItem("farmBookings") || "[]"
            );

            bookings.push(booking);

            localStorage.setItem(
                "farmBookings",
                JSON.stringify(bookings)
            );


            /* =========================
               WHATSAPP MESSAGE
               ========================= */

            const message =
                "🌾 *Farm Worker Booking Payment*%0A%0A" +

                "👤 Employer: " +
                encodeURIComponent(requirement.employerName || "") +

                "%0A📍 Location: " +
                encodeURIComponent(requirement.location || "") +

                "%0A🔨 Work: " +
                encodeURIComponent(requirement.workType || "") +

                "%0A📅 Date: " +
                encodeURIComponent(requirement.workDate || "") +

                "%0A👷 Workers: " +
                workers +

                "%0A⏱ Hours: " +
                hours +

                "%0A💰 Amount: ₹" +
                total +

                "%0A🧾 UTR: " +
                encodeURIComponent(utr) +

                "%0A%0A📸 Payment screenshot WhatsApp वर manually attach केला आहे." +

                "%0A%0Aकृपया payment verify करून booking approve करा.";


            const whatsappURL =
                "https://wa.me/" +
                adminWhatsApp +
                "?text=" +
                message;


            /* =========================
               OPEN WHATSAPP
               ========================= */

            window.location.href = whatsappURL;

        });

    }
}
</script>
